<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusPass - Organizer Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<script>
(function () {

    const ORGANIZER_PIN = "782620";

    const enteredPin = prompt(
        "JEMS Organizer Access\n\nEnter Organizer PIN:"
    );

    if (enteredPin !== ORGANIZER_PIN) {

        alert("❌ Access Denied");

        window.location.replace("index.html");

    }

})();
</script>


<div class="container">

    <div class="header">

        <h1>CampusPass</h1>

        <p>Organizer Dashboard</p>

    </div>


    <div class="card">

        <h2>📊 Event Overview</h2>


        <!-- ========================= -->
        <!-- STATISTICS -->
        <!-- ========================= -->

        <div
            style="
                display:grid;
                grid-template-columns:repeat(2,1fr);
                gap:12px;
                margin-top:20px;
            ">

            <div class="status pending">

                <strong id="totalCount">
                    0
                </strong>

                <br>

                Total Registered

            </div>


            <div class="status paid">

                <strong id="paidCount">
                    0
                </strong>

                <br>

                Payment Paid

            </div>


            <div class="status pending">

                <strong id="pendingCount">
                    0
                </strong>

                <br>

                Payment Pending

            </div>


            <div class="status paid">

                <strong id="enteredCount">
                    0
                </strong>

                <br>

                Entry Completed

            </div>

        </div>


        <!-- ========================= -->
        <!-- ENTRY PENDING -->
        <!-- ========================= -->

        <div
            class="status pending"
            style="margin-top:15px;">

            <strong id="notEnteredCount">
                0
            </strong>

            <br>

            Entry Pending

        </div>


        <!-- ========================= -->
        <!-- REFRESH -->
        <!-- ========================= -->

        <button
            type="button"
            class="register-btn"
            onclick="loadDashboard()"
            style="margin-top:20px;">

            🔄 Refresh Dashboard

        </button>


        <!-- ========================= -->
        <!-- EXPORT -->
        <!-- ========================= -->

        <button
            type="button"
            class="register-btn"
            onclick="exportStudentData()"
            style="margin-top:12px;">

            📥 Export Student Data

        </button>


        <!-- ========================= -->
        <!-- STUDENT LIST -->
        <!-- ========================= -->

        <h2 style="margin-top:30px;">

            Registered Students

        </h2>


        <div style="margin-top:15px;">

            <input
                type="text"
                id="studentSearch"
                placeholder="🔍 Search by Name, Roll No, Pass ID or Mobile"
                oninput="searchStudents()"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ccc;
                    border-radius:8px;
                    box-sizing:border-box;
                    font-size:15px;
                ">

        </div>


        <div
            id="studentList"
            style="margin-top:15px;">

            Loading...

        </div>


        <!-- ================================================= -->
        <!-- VOLUNTEER PAYMENT ACTIVITY -->
        <!-- ================================================= -->

        <h2 style="margin-top:35px;">

            👥 Volunteer Payment Activity

        </h2>


        <p
            style="
                color:#666;
                font-size:14px;
                margin-top:6px;
            ">

            See which volunteer collected payments and when.

        </p>


        <button
            type="button"
            class="register-btn"
            onclick="loadPaymentActivity()"
            style="margin-top:12px;">

            🔄 Refresh Payment Activity

        </button>


        <div
            id="volunteerActivityList"
            style="margin-top:15px;">

            Loading activity...

        </div>


        <!-- ========================= -->
        <!-- BACK -->
        <!-- ========================= -->

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='index.html'"
            style="margin-top:20px;">

            ← Back

        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>


<script>


// ==========================================
// LOAD DASHBOARD
// ==========================================

async function loadDashboard() {

    const students =
        await getStudents();


    // ======================================
    // COUNTS
    // ======================================

    const total =
        students.length;


    const paid =
        students.filter(
            student =>
                String(
                    student.payment_status ||
                    student.paymentStatus ||
                    ""
                ).toUpperCase() === "PAID"
        ).length;


    const pending =
        total - paid;


    const entered =
        students.filter(
            student =>
                String(
                    student.entry_status ||
                    student.entryStatus ||
                    ""
                ).toUpperCase() === "ENTERED"
        ).length;


    const notEntered =
        total - entered;


    // ======================================
    // DISPLAY COUNTS
    // ======================================

    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "paidCount"
    ).textContent =
        paid;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "enteredCount"
    ).textContent =
        entered;


    document.getElementById(
        "notEnteredCount"
    ).textContent =
        notEntered;


    // ======================================
    // STUDENT LIST
    // ======================================

    const list =
        document.getElementById(
            "studentList"
        );


    if (students.length === 0) {

        list.innerHTML =
            "<p>No students registered yet.</p>";

    } else {

        list.innerHTML = "";


        students.forEach(
            function(student) {

                const name =
                    student.name || "-";


                const roll =
                    student.roll_no ||
                    student.rollNo ||
                    "-";


                const passId =
                    student.pass_id ||
                    student.passId ||
                    "-";


                const payment =
                    String(
                        student.payment_status ||
                        student.paymentStatus ||
                        "PENDING"
                    ).toUpperCase();


                const entry =
                    String(
                        student.entry_status ||
                        student.entryStatus ||
                        "NOT ENTERED"
                    ).toUpperCase();


                const card =
                    document.createElement(
                        "div"
                    );


                card.style.border =
                    "1px solid #ddd";


                card.style.borderRadius =
                    "10px";


                card.style.padding =
                    "15px";


                card.style.marginBottom =
                    "12px";


                card.style.background =
                    "#ffffff";


                card.innerHTML =

                    "<strong>" +
                    name +
                    "</strong>" +

                    "<br>" +

                    "Roll No: " +
                    roll +

                    "<br>" +

                    "Pass ID: " +
                    passId +

                    "<br>" +

                    "Payment: " +
                    payment +

                    "<br>" +

                    "Entry: " +
                    entry +

                    (
                        entry === "ENTERED"
                        ?
                        "<br><br>" +

                        "<button " +
                        "type='button' " +
                        "style='width:100%;padding:10px;border:none;border-radius:8px;background:#dc3545;color:white;font-weight:700;cursor:pointer;' " +
                        "onclick=\"undoEntry('" +
                        passId +
                        "')\">" +

                        "↩️ Undo Entry" +

                        "</button>"

                        :
                        ""
                    )

                    +

                    "<br><br>" +

                    "<button " +
                    "type='button' " +
                    "style='width:100%;padding:10px;border:none;border-radius:8px;background:#6c757d;color:white;font-weight:700;cursor:pointer;' " +
                    "onclick=\"deleteStudent('" +
                    passId +
                    "')\">" +

                    "🗑️ Delete Student" +

                    "</button>";


                list.appendChild(
                    card
                );

            }
        );

    }


    // ======================================
    // PAYMENT ACTIVITY
    // ======================================

    loadPaymentActivity();

}


// ==========================================
// SEARCH STUDENTS
// ==========================================

function searchStudents() {

    const searchInput =
        document.getElementById(
            "studentSearch"
        );


    const searchText =
        searchInput.value
            .trim()
            .toLowerCase();


    const cards =
        document.querySelectorAll(
            "#studentList > div"
        );


    cards.forEach(function(card) {

        const text =
            card.textContent
                .toLowerCase();


        if (
            searchText === "" ||
            text.includes(searchText)
        ) {

            card.style.display =
                "block";

        } else {

            card.style.display =
                "none";

        }

    });

}


// ==========================================
// LOAD VOLUNTEER PAYMENT ACTIVITY
// ==========================================

async function loadPaymentActivity() {

    const container =
        document.getElementById(
            "volunteerActivityList"
        );


    container.innerHTML =
        "<p>Loading activity...</p>";


    const {
        data,
        error
    } = await db
        .from("payment_activity")
        .select("*")
        .order(
            "action_time",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Payment activity error:",
            error
        );


        container.innerHTML =
            "<p style='color:red;'>❌ Unable to load payment activity.</p>";


        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No payment activity found yet.</p>";


        return;

    }


    // ======================================
    // GROUP BY VOLUNTEER
    // ======================================

    const volunteers = {};


    data.forEach(function(activity) {

        const volunteer =
            activity.volunteer_id ||
            "Unknown Volunteer";


        if (!volunteers[volunteer]) {

            volunteers[volunteer] = [];

        }


        volunteers[volunteer].push(
            activity
        );

    });


    container.innerHTML = "";


    // ======================================
    // CREATE VOLUNTEER CARDS
    // ======================================

    Object.keys(volunteers)
        .forEach(function(volunteer) {

            const activities =
                volunteers[volunteer];


            const card =
                document.createElement(
                    "div"
                );


            card.style.border =
                "1px solid #ddd";


            card.style.borderRadius =
                "12px";


            card.style.padding =
                "16px";


            card.style.marginBottom =
                "14px";


            card.style.background =
                "#ffffff";


            const lastActivity =
                activities[0];


            const lastTime =
                formatActivityTime(
                    lastActivity.action_time
                );


            const activityId =
                "activity_" +
                Math.random()
                    .toString(36)
                    .substring(2, 10);


            card.innerHTML =

                "<div style='font-size:18px;font-weight:700;'>" +

                "👤 " +
                escapeHtml(volunteer) +

                "</div>" +

                "<div style='margin-top:10px;'>" +

                "💰 Payments Collected: " +

                "<strong>" +
                activities.length +
                "</strong>" +

                "</div>" +

                "<div style='margin-top:6px;color:#666;font-size:14px;'>" +

                "🕐 Last Payment: " +

                lastTime +

                "</div>" +

                "<button " +

                "type='button' " +

                "style='width:100%;margin-top:12px;padding:10px;border:none;border-radius:8px;background:#007bff;color:white;font-weight:700;cursor:pointer;' " +

                "onclick=\"toggleVolunteerActivity('" +
                activityId +
                "')\">" +

                "👁️ View Activity" +

                "</button>" +

                "<div " +

                "id='" +
                activityId +
                "'" +

                "style='display:none;margin-top:12px;'>" +

                "</div>";


            container.appendChild(
                card
            );


            const activityBox =
                document.getElementById(
                    activityId
                );


            activities.forEach(
                function(activity) {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.style.borderTop =
                        "1px solid #eee";


                    item.style.padding =
                        "12px 0";


                    item.innerHTML =

                        "<strong>" +

                        escapeHtml(
                            activity.student_name ||
                            "-"
                        ) +

                        "</strong>" +

                        "<br>" +

                        "<span style='font-size:14px;'>🎫 Pass ID: " +

                        escapeHtml(
                            activity.pass_id ||
                            "-"
                        ) +

                        "</span>" +

                        "<br>" +

                        "<span style='font-size:14px;'>🔄 " +

                        escapeHtml(
                            activity.old_status ||
                            "-"
                        ) +

                        " → " +

                        escapeHtml(
                            activity.new_status ||
                            "-"
                        ) +

                        "</span>" +

                        "<br>" +

                        "<span style='font-size:13px;color:#666;'>🕐 " +

                        formatActivityTime(
                            activity.action_time
                        ) +

                        "</span>";


                    activityBox.appendChild(
                        item
                    );

                }
            );

        });

}


// ==========================================
// TOGGLE VOLUNTEER ACTIVITY
// ==========================================

function toggleVolunteerActivity(
    activityId
) {

    const box =
        document.getElementById(
            activityId
        );


    if (!box) {
        return;
    }


    if (
        box.style.display === "none"
    ) {

        box.style.display =
            "block";

    } else {

        box.style.display =
            "none";

    }

}


// ==========================================
// FORMAT ACTIVITY TIME
// ==========================================

function formatActivityTime(
    time
) {

    if (!time) {
        return "-";
    }


    const date =
        new Date(time);


    if (isNaN(date.getTime())) {
        return "-";
    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        }
    );

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// UNDO ENTRY
// ==========================================

async function undoEntry(passId) {

    const confirmed =
        confirm(
            "Are you sure you want to undo this entry?"
        );


    if (!confirmed) {
        return;
    }


    const searchId =
        String(passId || "")
            .trim()
            .toUpperCase();


    const {
        data,
        error
    } = await db
        .from("students")
        .update({

            entry_status:
                "NOT ENTERED",

            entry_time:
                null

        })
        .eq(
            "pass_id",
            searchId
        )
        .eq(
            "entry_status",
            "ENTERED"
        )
        .select()
        .maybeSingle();


    if (error) {

        console.error(
            "Undo entry error:",
            error
        );


        alert(
            "❌ Unable to undo entry."
        );


        return;

    }


    if (!data) {

        alert(
            "❌ Entry could not be undone."
        );


        return;

    }


    alert(
        "✅ Entry successfully undone."
    );


    loadDashboard();

}


// ==========================================
// DELETE STUDENT
// ==========================================

async function deleteStudent(passId) {

    const searchId =
        String(passId || "")
            .trim()
            .toUpperCase();


    const confirmed =
        confirm(
            "⚠️ Delete this student?\n\n" +
            "This will permanently remove the student's " +
            "registration, payment status and entry record.\n\n" +
            "This action cannot be undone."
        );


    if (!confirmed) {
        return;
    }


    // --------------------------------------
    // Second confirmation
    // --------------------------------------
      // --------------------------------------
    // Second confirmation
    // --------------------------------------

    const finalConfirm =
        confirm(
            "FINAL CONFIRMATION\n\n" +
            "Delete student with Pass ID:\n" +
            searchId +
            "\n\n" +
            "Press OK to permanently delete."
        );


    if (!finalConfirm) {
        return;
    }


    // --------------------------------------
    // Delete from Supabase
    // --------------------------------------

    const {
        data,
        error
    } = await db
        .from("students")
        .delete()
        .eq(
            "pass_id",
            searchId
        )
        .select()
        .maybeSingle();


    if (error) {

        console.error(
            "Delete student error:",
            error
        );


        alert(
            "❌ Unable to delete student."
        );


        return;

    }


    if (!data) {

        alert(
            "❌ Student could not be deleted."
        );


        return;

    }


    alert(
        "✅ Student deleted successfully."
    );


    loadDashboard();

}


// ==========================================
// EXPORT STUDENT DATA
// ==========================================

async function exportStudentData() {

    const students =
        await getStudents();


    if (!students || students.length === 0) {

        alert(
            "❌ No student data available."
        );


        return;

    }


    const headers = [

        "Name",
        "Roll Number",
        "Branch",
        "Year",
        "Mobile",
        "Pass ID",
        "Payment Status",
        "Entry Status",
        "Registration Date",
        "Entry Time"

    ];


    const rows =
        students.map(function(student) {

            return [

                student.name || "",

                student.roll_no || "",

                student.branch || "",

                student.year || "",

                student.mobile || "",

                student.pass_id || "",

                student.payment_status || "",

                student.entry_status || "",

                student.created_at || "",

                student.entry_time || ""

            ];

        });


    const csvData = [

        headers,

        ...rows

    ];


    const csv =
        csvData
            .map(function(row) {

                return row
                    .map(function(value) {

                        return '"' +
                            String(value)
                                .replace(/"/g, '""') +
                            '"';

                    })
                    .join(",");

            })
            .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "JEMS_Student_Backup.csv";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);


    alert(
        "✅ Student data exported successfully."
    );

}


// ==========================================
// START DASHBOARD
// ==========================================

loadDashboard();

</script>

</body>

</html>
