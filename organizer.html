<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusPass - Organizer Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>
  <script>
(function () {

    const ORGANIZER_PIN = "782620";

    const enteredPin = prompt(
        "JEMS Organizer Access\n\nEnter Organizer PIN:"
    );

    if (enteredPin !== ORGANIZER_PIN) {

        alert("❌ Access Denied");

        window.location.replace("index.html");

    }

})();
</script>

<div class="container">

    <div class="header">

        <h1>CampusPass</h1>

        <p>Organizer Dashboard</p>

    </div>


    <div class="card">

        <h2>📊 Event Overview</h2>


        <!-- ========================= -->
        <!-- STATISTICS -->
        <!-- ========================= -->

        <div
            style="
                display:grid;
                grid-template-columns:repeat(2,1fr);
                gap:12px;
                margin-top:20px;
            ">


            <div class="status pending">

                <strong
                    id="totalCount">
                    0
                </strong>

                <br>

                Total Registered

            </div>


            <div class="status paid">

                <strong
                    id="paidCount">
                    0
                </strong>

                <br>

                Payment Paid

            </div>


            <div
                class="status pending">

                <strong
                    id="pendingCount">
                    0
                </strong>

                <br>

                Payment Pending

            </div>


            <div
                class="status paid">

                <strong
                    id="enteredCount">
                    0
                </strong>

                <br>

                Entry Completed

            </div>

        </div>


        <!-- ========================= -->
        <!-- ENTRY PENDING -->
        <!-- ========================= -->

        <div
            class="status pending"
            style="margin-top:15px;">

            <strong
                id="notEnteredCount">
                0
            </strong>

            <br>

            Entry Pending

        </div>


        <!-- ========================= -->
        <!-- REFRESH -->
        <!-- ========================= -->

        <button
            type="button"
            class="register-btn"
            onclick="loadDashboard()"
            style="margin-top:20px;">

            🔄 Refresh Dashboard

        </button>
      

<button
    type="button"
    class="register-btn"
    onclick="exportStudentData()"
    style="margin-top:12px;">

    📥 Export Student Data

</button>
        <!-- ========================= -->
        <!-- STUDENT LIST -->
        <!-- ========================= -->

        <h2
            style="margin-top:30px;">

            Registered Students

        </h2>


        <div
            id="studentList"
            style="margin-top:15px;">

            Loading...

        </div>


        <!-- ========================= -->
        <!-- BACK -->
        <!-- ========================= -->

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='index.html'"
            style="margin-top:20px;">

            ← Back

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>



<script>

// ==========================================
// LOAD DASHBOARD
// ==========================================

async function loadDashboard() {

    const students =
        await getStudents();


    // ======================================
    // COUNTS
    // ======================================

    const total =
        students.length;


    const paid =
        students.filter(
            student =>
                String(
                    student.payment_status ||
                    student.paymentStatus ||
                    ""
                ).toUpperCase() === "PAID"
        ).length;


    const pending =
        total - paid;


    const entered =
        students.filter(
            student =>
                String(
                    student.entry_status ||
                    student.entryStatus ||
                    ""
                ).toUpperCase() === "ENTERED"
        ).length;


    const notEntered =
        total - entered;


    // ======================================
    // DISPLAY COUNTS
    // ======================================

    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "paidCount"
    ).textContent =
        paid;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "enteredCount"
    ).textContent =
        entered;


    document.getElementById(
        "notEnteredCount"
    ).textContent =
        notEntered;


    // ======================================
    // STUDENT LIST
    // ======================================

    const list =
        document.getElementById(
            "studentList"
        );


    if (students.length === 0) {

        list.innerHTML =
            "<p>No students registered yet.</p>";

        return;

    }


    list.innerHTML = "";


    students.forEach(
        function(student) {

            const name =
                student.name || "-";


            const roll =
                student.roll_no ||
                student.rollNo ||
                "-";


            const passId =
                student.pass_id ||
                student.passId ||
                "-";


            const payment =
                String(
                    student.payment_status ||
                    student.paymentStatus ||
                    "PENDING"
                ).toUpperCase();


            const entry =
                String(
                    student.entry_status ||
                    student.entryStatus ||
                    "NOT ENTERED"
                ).toUpperCase();


            const card =
                document.createElement(
                    "div"
                );


            card.style.border =
                "1px solid #ddd";


            card.style.borderRadius =
                "10px";


            card.style.padding =
                "15px";


            card.style.marginBottom =
                "12px";


            card.style.background =
                "#ffffff";


          card.innerHTML =

    "<strong>" +
    name +
    "</strong>" +

    "<br>" +

    "Roll No: " +
    roll +

    "<br>" +

    "Pass ID: " +
    passId +

    "<br>" +

    "Payment: " +
    payment +

    "<br>" +

    "Entry: " +
    entry +

    (
        entry === "ENTERED"
        ?
        "<br><br>" +

        "<button " +
        "type='button' " +
        "style='width:100%;padding:10px;border:none;border-radius:8px;background:#dc3545;color:white;font-weight:700;cursor:pointer;' " +
        "onclick=\"undoEntry('" +
        passId +
        "')\">" +

        "↩️ Undo Entry" +

        "</button>"

        :
        ""
    )

    +

    "<br><br>" +

    "<button " +
    "type='button' " +
    "style='width:100%;padding:10px;border:none;border-radius:8px;background:#6c757d;color:white;font-weight:700;cursor:pointer;' " +
    "onclick=\"deleteStudent('" +
    passId +
    "')\">" +

    "🗑️ Delete Student" +

    "</button>";


            list.appendChild(
                card
            );

        }
    );

}


// ==========================================
// START
// ==========================================
// ==========================================
// UNDO ENTRY
// ==========================================

async function undoEntry(passId) {

    const confirmed =
        confirm(
            "Are you sure you want to undo this entry?"
        );

    if (!confirmed) {
        return;
    }


    const searchId =
        String(passId || "")
            .trim()
            .toUpperCase();


    const {
        data,
        error
    } = await db
        .from("students")
        .update({

            entry_status:
                "NOT ENTERED",

            entry_time:
                null

        })
        .eq(
            "pass_id",
            searchId
        )
        .eq(
            "entry_status",
            "ENTERED"
        )
        .select()
        .maybeSingle();


    if (error) {

        console.error(
            "Undo entry error:",
            error
        );

        alert(
            "❌ Unable to undo entry."
        );

        return;
    }


    if (!data) {

        alert(
            "❌ Entry could not be undone."
        );

        return;
    }


    alert(
        "✅ Entry successfully undone."
    );


    loadDashboard();

}
  // ==========================================
// DELETE STUDENT
// ==========================================

async function deleteStudent(passId) {

    const searchId =
        String(passId || "")
            .trim()
            .toUpperCase();


    const confirmed =
        confirm(
            "⚠️ Delete this student?\n\n" +
            "This will permanently remove the student's " +
            "registration, payment status and entry record.\n\n" +
            "This action cannot be undone."
        );


    if (!confirmed) {
        return;
    }


    // --------------------------------------
    // Second confirmation
    // --------------------------------------

    const finalConfirm =
        confirm(
            "FINAL CONFIRMATION\n\n" +
            "Delete student with Pass ID:\n" +
            searchId +
            "\n\n" +
            "Press OK to permanently delete."
        );


    if (!finalConfirm) {
        return;
    }


    // --------------------------------------
    // Delete from Supabase
    // --------------------------------------

    const {
        data,
        error
    } = await db
        .from("students")
        .delete()
        .eq(
            "pass_id",
            searchId
        )
        .select()
        .maybeSingle();


    // --------------------------------------
    // Database error
    // --------------------------------------

    if (error) {

        console.error(
            "Delete student error:",
            error
        );

        alert(
            "❌ Unable to delete student."
        );

        return;
    }


    // --------------------------------------
    // Student not deleted
    // --------------------------------------

    if (!data) {

        alert(
            "❌ Student could not be deleted."
        );

        return;
    }


    // --------------------------------------
    // Success
    // --------------------------------------

    alert(
        "✅ Student deleted successfully."
    );


    // --------------------------------------
    // Refresh dashboard
    // --------------------------------------

    loadDashboard();

}
  // ==========================================
// EXPORT STUDENT DATA
// ==========================================

async function exportStudentData() {

    const students =
        await getStudents();


    if (!students || students.length === 0) {

        alert(
            "❌ No student data available."
        );

        return;

    }


    const headers = [

        "Name",
        "Roll Number",
        "Branch",
        "Year",
        "Mobile",
        "Pass ID",
        "Payment Status",
        "Entry Status",
        "Registration Date",
        "Entry Time"

    ];


    const rows =
        students.map(function(student) {

            return [

                student.name || "",

                student.roll_no || "",

                student.branch || "",

                student.year || "",

                student.mobile || "",

                student.pass_id || "",

                student.payment_status || "",

                student.entry_status || "",

                student.created_at || "",

                student.entry_time || ""

            ];

        });


    const csvData = [

        headers,

        ...rows

    ];


    const csv =
        csvData
            .map(function(row) {

                return row
                    .map(function(value) {

                        return '"' +
                            String(value)
                                .replace(/"/g, '""') +
                            '"';

                    })
                    .join(",");

            })
            .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "JEMS_Student_Backup.csv";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);


    alert(
        "✅ Student data exported successfully."
    );

  }
loadDashboard();

</script>

</body>

</html>
