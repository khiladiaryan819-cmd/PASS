<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusPass - Entry Verification</title>

    <link
        rel="stylesheet"
        href="style.css">

    <!-- QR SCANNER LIBRARY -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

</head>


<body>
  <script>
(function () {

    const GATE_PIN = "910346";

    const enteredPin = prompt(
        "JEMS Gate Access\n\nEnter Gate PIN:"
    );

    if (enteredPin !== GATE_PIN) {

        alert("❌ Access Denied");

        window.location.replace("index.html");

    }

})();
</script>

<div class="container">

    <div class="header">

        <h1>CampusPass</h1>

        <p>Event Entry Verification</p>

    </div>


    <div class="card">

        <h2>🎫 Gate Verification</h2>


        <!-- ========================= -->
        <!-- QR SCANNER -->
        <!-- ========================= -->

        <label>Scan Student QR</label>

        <div
            id="qr-reader"
            style="
                width:100%;
                min-height:300px;
                margin:20px 0;
                border:3px solid #000;
                background:#ffffff;
            ">

            <p
                style="
                    text-align:center;
                    padding:100px 10px;
                ">

                Starting Camera...

            </p>

        </div>


        <!-- ========================= -->
        <!-- MANUAL PASS ID -->
        <!-- ========================= -->

        <div class="input-group">

            <label>Pass ID</label>

            <input
                type="text"
                id="entryPassId"
                placeholder="Enter Pass ID"
                autocomplete="off">

        </div>


        <button
            type="button"
            class="register-btn"
            id="verifyButton">

            Verify Pass

        </button>


        <!-- ========================= -->
        <!-- RESULT -->
        <!-- ========================= -->

        <div
            id="entryResult"
            style="
                display:none;
                margin-top:20px;
            ">

            <div class="student-info">


                <div class="info-row">

                    <span>Student Name</span>

                    <strong id="entryName">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Roll Number</span>

                    <strong id="entryRoll">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Branch</span>

                    <strong id="entryBranch">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Year</span>

                    <strong id="entryYear">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Pass ID</span>

                    <strong id="entryId">
                        -
                    </strong>

                </div>

            </div>


            <!-- ========================= -->
            <!-- VERIFICATION STATUS -->
            <!-- ========================= -->

            <div
                id="verificationStatus"
                style="
                    margin-top:20px;
                    padding:18px;
                    border-radius:10px;
                    text-align:center;
                    font-weight:bold;
                    font-size:18px;
                    white-space:pre-line;
                ">
            </div>

        </div>


        <!-- ========================= -->
        <!-- BACK BUTTON -->
        <!-- ========================= -->

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='index.html'"
            style="margin-top:12px;">

            ← Back

        </button>

    </div>

</div>


<!-- ================================================= -->
<!-- SUPABASE LIBRARY -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ================================================= -->
<!-- JEMS APP -->
<!-- ================================================= -->

<script src="app.js"></script>


<!-- ================================================= -->
<!-- SCANNER / VERIFICATION JAVASCRIPT -->
<!-- ================================================= -->

<script>


// ==========================================
// ELEMENTS
// ==========================================

const passInput =
    document.getElementById(
        "entryPassId"
    );


const resultBox =
    document.getElementById(
        "entryResult"
    );


const statusBox =
    document.getElementById(
        "verificationStatus"
    );


// ==========================================
// SHOW STUDENT DETAILS
// ==========================================

function showStudentDetails(student) {

    document.getElementById(
        "entryName"
    ).textContent =
        student.name || "-";


    document.getElementById(
        "entryRoll"
    ).textContent =
        student.rollNo || "-";


    document.getElementById(
        "entryBranch"
    ).textContent =
        student.branch || "-";


    document.getElementById(
        "entryYear"
    ).textContent =
        student.year || "-";


    document.getElementById(
        "entryId"
    ).textContent =
        student.passId || "-";


    resultBox.style.display =
        "block";

}


// ==========================================
// SHOW STATUS
// ==========================================

function showStatus(
    message,
    background,
    color
) {

    resultBox.style.display =
        "block";


    statusBox.textContent =
        message;


    statusBox.style.background =
        background;


    statusBox.style.color =
        color;

}


// ==========================================
// VERIFY PASS
// ==========================================

async function verifyPass() {


    // --------------------------------------
    // Get Pass ID
    // --------------------------------------

    let passId =
        passInput.value.trim();


    // --------------------------------------
    // Extract JEMS ID
    // --------------------------------------

    const match =
        passId.match(
            /JEMS\d{5}/i
        );


    if (match) {

        passId =
            match[0].toUpperCase();

        passInput.value =
            passId;

    }


    // --------------------------------------
    // Empty Pass ID
    // --------------------------------------

    if (!passId) {

        showStatus(
            "Please enter or scan Pass ID.",
            "#fff3cd",
            "#856404"
        );

        return;

    }


    // --------------------------------------
    // Show Searching
    // --------------------------------------

    showStatus(
        "Searching...",
        "#e2e3e5",
        "#41464b"
    );


    // --------------------------------------
    // Search Supabase
    // --------------------------------------

    try {


        const {
            data: studentData,
            error
        } = await db
            .from("students")
            .select("*")
            .eq(
                "pass_id",
                passId
            )
            .maybeSingle();


        // ----------------------------------
        // Database Error
        // ----------------------------------

        if (error) {

            console.error(
                "Supabase search error:",
                error
            );


            showStatus(
                "❌ DATABASE ERROR\n" +
                error.message,
                "#f8d7da",
                "#842029"
            );


            return;

        }


        // ----------------------------------
        // Pass Not Found
        // ----------------------------------

        if (!studentData) {


            document.getElementById(
                "entryName"
            ).textContent =
                "-";


            document.getElementById(
                "entryRoll"
            ).textContent =
                "-";


            document.getElementById(
                "entryBranch"
            ).textContent =
                "-";


            document.getElementById(
                "entryYear"
            ).textContent =
                "-";


            document.getElementById(
                "entryId"
            ).textContent =
                passId;


            showStatus(
                "❌ ENTRY DENIED\nPASS NOT FOUND",
                "#f8d7da",
                "#842029"
            );


            return;

        }


        // ----------------------------------
        // Convert Supabase Data
        // ----------------------------------

        const student = {

            id:
                studentData.id,

            name:
                studentData.name,

            rollNo:
                studentData.roll_no,

            branch:
                studentData.branch,

            year:
                studentData.year,

            mobile:
                studentData.mobile,

            passId:
                studentData.pass_id,

            paymentStatus:
                studentData.payment_status,

            entryStatus:
                studentData.entry_status,

            registeredAt:
                studentData.created_at,

            entryTime:
                studentData.entry_time

        };


        // ----------------------------------
        // Show Student Details
        // ----------------------------------

        showStudentDetails(
            student
        );


        // ----------------------------------
        // Payment Check
        // ----------------------------------

        if (
            String(
                student.paymentStatus
            ).toUpperCase() !== "PAID"
        ) {


            showStatus(
                "❌ ENTRY DENIED\nPAYMENT PENDING",
                "#fff3cd",
                "#856404"
            );


            return;

        }


        // ----------------------------------
        // Already Entered
        // ----------------------------------

        if (
            String(
                student.entryStatus
            ).toUpperCase() ===
            "ENTERED"
        ) {


            showStatus(
                "❌ ENTRY DENIED\nPASS ALREADY USED",
                "#f8d7da",
                "#842029"
            );


            return;

        }


        // ----------------------------------
        // Mark Entry
        // ----------------------------------

        const entryResult =
            await markEntry(
                student.passId
            );


        // ----------------------------------
        // Entry Failed
        // ----------------------------------

        if (
            !entryResult.success
        ) {


            showStatus(
                "❌ ENTRY DENIED\n" +
                entryResult.message,
                "#f8d7da",
                "#842029"
            );


            return;

        }


        // ----------------------------------
        // Entry Allowed
        // ----------------------------------

        showStatus(
            "✓ ENTRY ALLOWED\nWELCOME!",
            "#d1e7dd",
            "#0f5132"
        );


    }

    catch (error) {


        console.error(
            "Verification error:",
            error
        );


        showStatus(
            "❌ ERROR\n" +
            error.message,
            "#f8d7da",
            "#842029"
        );

    }

}


// ==========================================
// VERIFY BUTTON
// ==========================================

document
    .getElementById(
        "verifyButton"
    )
    .addEventListener(
        "click",
        verifyPass
    );


// ==========================================
// QR SCANNER
// ==========================================

let qrScanner = null;


// ==========================================
// START QR SCANNER
// ==========================================

async function startQRScanner() {


    try {


        qrScanner =
            new Html5Qrcode(
                "qr-reader"
            );


        await qrScanner.start(

            {
                facingMode:
                    "environment"
            },


            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },


            async function(decodedText) {


                console.log(
                    "QR DATA:",
                    decodedText
                );


                // ------------------------------
                // Extract Pass ID
                // ------------------------------

                const match =
                    decodedText.match(
                        /JEMS\d{5}/i
                    );


                if (!match) {


                    alert(
                        "Invalid JEMS QR Code"
                    );


                    return;

                }


                const scannedPassId =
                    match[0].toUpperCase();


                // ------------------------------
                // Put Pass ID in input
                // ------------------------------

                passInput.value =
                    scannedPassId;


                // ------------------------------
                // Stop Camera
                // ------------------------------

                await stopQRScanner();


                // ------------------------------
                // Verify
                // ------------------------------

                await verifyPass();


            },


            function(errorMessage) {

                // QR not detected yet

            }

        );


        console.log(
            "JEMS QR Scanner Started"
        );


    }

    catch(error) {


        console.error(
            "QR Camera Error:",
            error
        );


        console.log(
            "Camera could not start."
        );

    }

}


// ==========================================
// STOP QR SCANNER
// ==========================================

async function stopQRScanner() {


    if (!qrScanner) {

        return;

    }


    try {


        if (
            qrScanner.isScanning
        ) {

            await qrScanner.stop();

        }


    }

    catch(error) {


        console.log(
            "Scanner stop:",
            error
        );

    }

}


// ==========================================
// START
// ==========================================

startQRScanner();


</script>


</body>

</html>
