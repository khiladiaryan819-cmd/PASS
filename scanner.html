<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JEMS - Entry Verification</title>

    <link
        rel="stylesheet"
        href="style.css">

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>JEMS</h1>

        <p>Event Entry Verification</p>

    </div>


    <div class="card">

        <h2>🎫 Gate Verification</h2>


        <!-- ========================= -->
        <!-- QR SCANNER -->
        <!-- ========================= -->

        <label>Scan Student QR</label>

        <div
            id="qr-reader"
            style="
                width:100%;
                min-height:300px;
                margin:20px 0;
                border:3px solid #000;
                background:#ffffff;
            ">

            <p
                style="
                    text-align:center;
                    padding:100px 10px;
                ">

                Starting Camera...

            </p>

        </div>


        <!-- ========================= -->
        <!-- PASS ID -->
        <!-- ========================= -->

        <div class="input-group">

            <label>Pass ID</label>

            <input
                type="text"
                id="entryPassId"
                placeholder="Enter Pass ID"
                autocomplete="off">

        </div>


        <button
            type="button"
            class="register-btn"
            id="verifyButton">

            Verify Pass

        </button>


        <!-- ========================= -->
        <!-- RESULT -->
        <!-- ========================= -->

        <div
            id="entryResult"
            style="
                display:none;
                margin-top:20px;
            ">

            <div class="student-info">

                <div class="info-row">

                    <span>Student Name</span>

                    <strong id="entryName">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Roll Number</span>

                    <strong id="entryRoll">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Branch</span>

                    <strong id="entryBranch">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Year</span>

                    <strong id="entryYear">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>Pass ID</span>

                    <strong id="entryId">
                        -
                    </strong>

                </div>

            </div>


            <!-- PAYMENT / ENTRY STATUS -->

            <div
                id="verificationStatus"
                style="
                    margin-top:20px;
                    padding:18px;
                    border-radius:10px;
                    text-align:center;
                    font-weight:bold;
                    font-size:18px;
                    white-space:pre-line;
                ">
            </div>

        </div>


        <!-- BACK -->

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='index.html'"
            style="margin-top:12px;">

            ← Back

        </button>

    </div>

</div>


<!-- ========================= -->
<!-- JEMS APP -->
<!-- ========================= -->

<script src="app.js"></script>


<script>

// ==========================================
// ELEMENTS
// ==========================================

const passInput =
    document.getElementById(
        "entryPassId"
    );

const resultBox =
    document.getElementById(
        "entryResult"
    );

const statusBox =
    document.getElementById(
        "verificationStatus"
    );


// ==========================================
// SHOW STUDENT DETAILS
// ==========================================

function showStudentDetails(student) {

    document.getElementById(
        "entryName"
    ).textContent =
        student.name || "-";


    document.getElementById(
        "entryRoll"
    ).textContent =
        student.rollNo || "-";


    document.getElementById(
        "entryBranch"
    ).textContent =
        student.branch || "-";


    document.getElementById(
        "entryYear"
    ).textContent =
        student.year || "-";


    document.getElementById(
        "entryId"
    ).textContent =
        student.passId || "-";


    resultBox.style.display =
        "block";

}


// ==========================================
// STATUS
// ==========================================

function showStatus(
    message,
    background,
    color
) {

    statusBox.textContent =
        message;

    statusBox.style.background =
        background;

    statusBox.style.color =
        color;

}


// ==========================================
// VERIFY PASS
// ==========================================

async function verifyPass() {

    let passId =
        passInput.value.trim();


    // --------------------------------------
    // Extract JEMS ID
    // --------------------------------------

    const match =
        passId.match(
            /JEMS\d{5}/i
        );


    if (match) {

        passId =
            match[0].toUpperCase();

        passInput.value =
            passId;

    }


    // --------------------------------------
    // Empty
    // --------------------------------------

    if (!passId) {

        alert(
            "Please enter or scan Pass ID."
        );

        return;

    }


    // --------------------------------------
    // Find Student
    // --------------------------------------

    const { data: studentData, error } = await db
    .from("students")
    .select("*")
    .eq("pass_id", passId)
    .maybeSingle();

if (error) {
    console.error("Supabase search error:", error);

    resultBox.style.display = "block";

    showStatus(
        "❌ DATABASE ERROR\n" + error.message,
        "#f8d7da",
        "#842029"
    );

    return;
}

const student = studentData ? {
    id: studentData.id,
    name: studentData.name,
    rollNo: studentData.roll_no,
    branch: studentData.branch,
    year: studentData.year,
    mobile: studentData.mobile,
    passId: studentData.pass_id,
    paymentStatus: studentData.payment_status,
    entryStatus: studentData.entry_status,
    registeredAt: studentData.created_at,
    entryTime: studentData.entry_time
} : null;


    // --------------------------------------
    // Not Found
    // --------------------------------------

    if (!student) {

        resultBox.style.display =
            "block";


        document.getElementById(
            "entryName"
        ).textContent = "-";


        document.getElementById(
            "entryRoll"
        ).textContent = "-";


        document.getElementById(
            "entryBranch"
        ).textContent = "-";


        document.getElementById(
            "entryYear"
        ).textContent = "-";


        document.getElementById(
            "entryId"
        ).textContent =
            passId;


        showStatus(
            "❌ ENTRY DENIED\nPass Not Found",
            "#f8d7da",
            "#842029"
        );

        return;

    }


    // --------------------------------------
    // Show Details
    // --------------------------------------

    showStudentDetails(
        student
    );


    // --------------------------------------
    // Payment Check
    // --------------------------------------

    if (
        String(
            student.paymentStatus
        ).toUpperCase() !== "PAID"
    ) {

        showStatus(
            "❌ ENTRY DENIED\nPAYMENT PENDING",
            "#fff3cd",
            "#856404"
        );

        return;

    }


    // --------------------------------------
    // Already Entered
    // --------------------------------------

    if (
        String(
            student.entryStatus
        ).toUpperCase() === "ENTERED"
    ) {

        showStatus(
            "❌ ENTRY DENIED\nPASS ALREADY USED",
            "#f8d7da",
            "#842029"
        );

        return;

    }


    // --------------------------------------
    // Mark Entry
    // --------------------------------------

    const entryResult =
        await markEntry(
            student.passId
        );


    if (!entryResult.success) {

        showStatus(
            "❌ ENTRY DENIED\n" +
            entryResult.message,
            "#f8d7da",
            "#842029"
        );

        return;

    }


    // --------------------------------------
    // ALLOWED
    // --------------------------------------

    showStatus(
        "✓ ENTRY ALLOWED\nWELCOME!",
        "#d1e7dd",
        "#0f5132"
    );

}


// ==========================================
// VERIFY BUTTON
// ==========================================

document
.getElementById(
    "verifyButton"
)
.addEventListener(
    "click",
    verifyPass
);


// ==========================================
// QR SCANNER
// ==========================================

let qrScanner = null;


async function startQRScanner() {

    try {

        qrScanner =
            new Html5Qrcode(
                "qr-reader"
            );


        await qrScanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },


            async function(decodedText) {

                console.log(
                    "QR DATA:",
                    decodedText
                );


                // --------------------------------
                // Extract Pass ID
                // --------------------------------

                const match =
                    decodedText.match(
                        /JEMS\d{5}/i
                    );


                if (!match) {

                    alert(
                        "Invalid JEMS QR Code"
                    );

                    return;

                }


                const scannedPassId =
                    match[0].toUpperCase();


                // --------------------------------
                // Put ID in box
                // --------------------------------

                passInput.value =
                    scannedPassId;


                // --------------------------------
                // Stop Camera
                // --------------------------------

                await stopQRScanner();


                // --------------------------------
                // Verify
                // --------------------------------

                await verifyPass();

            },


            function(errorMessage) {

                // QR not detected yet

            }

        );


        console.log(
            "JEMS QR Scanner Started"
        );

    }

    catch(error) {

        console.error(
            "QR Camera Error:",
            error
        );


        alert(
            "Camera start nahi ho pa raha.\n" +
            "Browser Camera Permission Allow karein."
        );

    }

}


// ==========================================
// STOP SCANNER
// ==========================================

async function stopQRScanner() {

    if (!qrScanner) {

        return;

    }


    try {

        if (
            qrScanner.isScanning
        ) {

            await qrScanner.stop();

        }

    }

    catch(error) {

        console.log(
            "Scanner stop:",
            error
        );

    }

}


// ==========================================
// START
// ==========================================

startQRScanner();
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>
<script>
document.getElementById("verifyButton").onclick = async function () {

    const passId =
        document.getElementById("entryPassId").value.trim();

    const resultBox =
        document.getElementById("entryResult");

    const statusBox =
        document.getElementById("verificationStatus");

    resultBox.style.display = "block";

    if (!passId) {
        statusBox.textContent = "Please enter Pass ID.";
        return;
    }

    statusBox.textContent = "Searching...";

    try {

        const { data, error } = await db
            .from("students")
            .select("*")
            .eq("pass_id", passId.toUpperCase())
            .maybeSingle();

        if (error) {
            console.error(error);
            statusBox.textContent =
                "Database Error: " + error.message;
            return;
        }

        if (!data) {
            statusBox.textContent =
                "❌ Pass Not Found";
            return;
        }

        document.getElementById("entryName").textContent =
            data.name || "-";

        document.getElementById("entryRoll").textContent =
            data.roll_no || "-";

        document.getElementById("entryBranch").textContent =
            data.branch || "-";

        document.getElementById("entryYear").textContent =
            data.year || "-";

        document.getElementById("entryId").textContent =
            data.pass_id || "-";

        statusBox.textContent =
            "✓ DATA FOUND\nPayment: " +
            data.payment_status +
            "\nEntry: " +
            data.entry_status;

    } catch (error) {

        console.error(error);

        statusBox.textContent =
            "JavaScript Error: " + error.message;
    }
};
</script>
</script>
</body>

</html>
