<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusPass - Event Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>CampusPass</h1>
            <p>🦚Shree Krishna Janmashtami Celebration🦚</p>
        </div>

        <div class="card">

            <h2>Student Registration</h2>

            <form id="registrationForm">

                <div class="input-group">
                    <label>Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        required>
                </div>

                <div class="input-group">
                    <label>Roll Number</label>
                    <input
                        type="text"
                        id="rollNo"
                        placeholder="Enter roll number"
                        required>
                </div>

                <div class="input-group">
                    <label>Branch</label>
                    <input
                        type="text"
                        id="branch"
                        placeholder="Enter branch"
                        required>
                </div>

                <div class="input-group">
                    <label>Year</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        required>
                </div>

                <button type="submit" class="register-btn">
                    Register Student
                </button>

            </form>

        </div>

        <div id="message"></div>

    </div>
  <!-- ================================= -->
<!-- FIND MY PASS -->
<!-- ================================= -->

<div class="card" style="margin-top:20px;">

    <h2>🔎 Find My Pass</h2>

    <p style="text-align:center; color:#666; margin-bottom:20px;">
        Already registered? Recover your event pass here.
    </p>

    <div class="input-group">

        <label for="recoverBranch">
            Branch
        </label>

        <input
            type="text"
            id="recoverBranch"
            placeholder="Enter your branch"
        >

    </div>


    <div class="input-group">

        <label for="recoverRollNo">
            Roll Number
        </label>

        <input
            type="text"
            id="recoverRollNo"
            placeholder="Enter your roll number"
        >

    </div>


    <div class="input-group">

        <label for="recoverMobile">
            Mobile Number
        </label>

        <input
            type="tel"
            id="recoverMobile"
            maxlength="10"
            placeholder="Enter registered mobile number"
        >

    </div>


    <button
        type="button"
        class="register-btn"
        onclick="findMyPass()">

        🔍 Find My Pass

    </button>


    <p id="recoverMessage"></p>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
<script>

async function findMyPass() {

    const branch =
        document
        .getElementById("recoverBranch")
        .value
        .trim();

    const rollNo =
        document
        .getElementById("recoverRollNo")
        .value
        .trim();

    const mobile =
        document
        .getElementById("recoverMobile")
        .value
        .trim();

    const message =
        document
        .getElementById("recoverMessage");


    // ==============================
    // VALIDATION
    // ==============================

    if (!branch || !rollNo || !mobile) {

        message.textContent =
            "Please fill all recovery fields.";

        message.style.color =
            "red";

        return;

    }


    if (!/^[6-9]\d{9}$/.test(mobile)) {

        message.textContent =
            "Please enter a valid 10-digit mobile number.";

        message.style.color =
            "red";

        return;

    }


    message.textContent =
        "Searching for your pass...";

    message.style.color =
        "#555";


    // ==============================
    // SEARCH SUPABASE
    // ==============================

    const {
        data,
        error
    } = await db
        .from("students")
        .select("*")
        .eq("branch", branch)
        .eq("roll_no", rollNo)
        .eq("mobile", mobile)
        .maybeSingle();


    // ==============================
    // DATABASE ERROR
    // ==============================

    if (error) {

        console.error(
            "Pass recovery error:",
            error
        );

        message.textContent =
            "Unable to find pass. Please try again.";

        message.style.color =
            "red";

        return;

    }


    // ==============================
    // NOT FOUND
    // ==============================

    if (!data) {

        message.textContent =
            "No registration found with these details.";

        message.style.color =
            "red";

        return;

    }


    // ==============================
    // SAVE RECOVERED PASS
    // ==============================

    const currentStudent = {

        id: data.id,

        name: data.name,

        rollNo: data.roll_no,

        branch: data.branch,

        year: data.year,

        mobile: data.mobile,

        passId: data.pass_id,

        paymentStatus:
            data.payment_status,

        entryStatus:
            data.entry_status,

        registeredAt:
            data.created_at,

        entryTime:
            data.entry_time

    };


    localStorage.setItem(
        "JEMS_CURRENT_PASS",
        JSON.stringify(
            currentStudent
        )
    );


    // ==============================
    // OPEN OLD PASS
    // ==============================

    message.textContent =
        "Pass found! Opening your pass...";

    message.style.color =
        "green";


    setTimeout(
        function () {

            window.location.href =
                "pass.html";

        },
        700
    );

}

</script>
</body>
</html>
