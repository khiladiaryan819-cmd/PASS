<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JEMS - Volunteer Payment</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>
  <script>
(function () {

    const VOLUNTEER_PIN = "865421";

    const enteredPin = prompt(
        "JEMS Volunteer Access\n\nEnter Volunteer PIN:"
    );

    if (enteredPin !== VOLUNTEER_PIN) {

        alert("❌ Access Denied");

        window.location.replace("index.html");

    }

})();
</script>

<div class="container">

    <div class="header">

        <h1>JEMS</h1>

        <p>Volunteer Payment Verification</p>

    </div>


    <div class="card">

        <h2>Payment Verification</h2>


        <!-- PASS ID -->

        <div class="input-group">

            <label>Pass ID</label>

            <input
                type="text"
                id="searchPassId"
                placeholder="Enter Pass ID"
                autocomplete="off">

        </div>


        <button
            type="button"
            class="register-btn"
            id="searchButton">

            Search Student

        </button>


        <!-- MESSAGE -->

        <div
            id="volunteerMessage"
            style="margin-top:15px;">
        </div>


        <!-- RESULT -->

        <div
            id="studentResult"
            style="
                display:none;
                margin-top:20px;
            ">

            <div class="student-info">

                <div class="info-row">
                    <span>Student Name</span>
                    <strong id="resultName">-</strong>
                </div>

                <div class="info-row">
                    <span>Roll Number</span>
                    <strong id="resultRoll">-</strong>
                </div>

                <div class="info-row">
                    <span>Branch</span>
                    <strong id="resultBranch">-</strong>
                </div>

                <div class="info-row">
                    <span>Year</span>
                    <strong id="resultYear">-</strong>
                </div>

                <div class="info-row">
                    <span>Mobile</span>
                    <strong id="resultMobile">-</strong>
                </div>

                <div class="info-row">
                    <span>Pass ID</span>
                    <strong id="resultPassId">-</strong>
                </div>

            </div>


            <!-- PAYMENT STATUS -->

            <div
                id="resultPaymentStatus"
                class="status pending"
                style="margin-top:18px;">

                PAYMENT PENDING

            </div>


            <!-- PAID BUTTON -->

            <button
                id="paidButton"
                type="button"
                class="register-btn"
                style="margin-top:15px;">

                ✓ Mark Payment as PAID

            </button>

        </div>


        <!-- BACK -->

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='index.html'"
            style="margin-top:12px;">

            ← Back

        </button>

    </div>

</div>


<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- JEMS APP -->
<script src="app.js"></script>


<script>

// ==========================================
// SELECTED STUDENT
// ==========================================

let selectedPassId = null;


// ==========================================
// MESSAGE
// ==========================================

function showMessage(message, type = "success") {

    const box =
        document.getElementById(
            "volunteerMessage"
        );

    box.textContent = message;

    box.style.color =
        type === "error"
            ? "red"
            : "green";
}


// ==========================================
// PAYMENT DISPLAY
// ==========================================

function updatePaymentDisplay(status) {

    const box =
        document.getElementById(
            "resultPaymentStatus"
        );

    const button =
        document.getElementById(
            "paidButton"
        );


    if (
        String(status).toUpperCase() ===
        "PAID"
    ) {

        box.textContent =
            "✓ PAYMENT PAID";

        box.className =
            "status paid";

        button.textContent =
            "✓ Payment Already PAID";

        button.disabled = true;

        button.style.opacity = "0.6";

    }
    else {

        box.textContent =
            "⚠ PAYMENT PENDING";

        box.className =
            "status pending";

        button.textContent =
            "✓ Mark Payment as PAID";

        button.disabled = false;

        button.style.opacity = "1";

    }

}


// ==========================================
// SHOW STUDENT
// ==========================================

function showStudent(student) {

    document.getElementById(
        "resultName"
    ).textContent =
        student.name || "-";


    document.getElementById(
        "resultRoll"
    ).textContent =
        student.rollNo || "-";


    document.getElementById(
        "resultBranch"
    ).textContent =
        student.branch || "-";


    document.getElementById(
        "resultYear"
    ).textContent =
        student.year || "-";


    document.getElementById(
        "resultMobile"
    ).textContent =
        student.mobile || "-";


    document.getElementById(
        "resultPassId"
    ).textContent =
        student.passId || "-";


    updatePaymentDisplay(
        student.paymentStatus
    );


    document.getElementById(
        "studentResult"
    ).style.display =
        "block";

}


// ==========================================
// SEARCH STUDENT
// ==========================================

async function searchPass() {

    const input =
        document.getElementById(
            "searchPassId"
        );


    const passId =
        input.value.trim();


    if (!passId) {

        showMessage(
            "Please enter a Pass ID.",
            "error"
        );

        return;

    }


    const student =
        await findStudentByPassId(
            passId
        );


    if (!student) {

        selectedPassId = null;


        document.getElementById(
            "studentResult"
        ).style.display =
            "none";


        showMessage(
            "Pass ID not found.",
            "error"
        );

        return;

    }


    selectedPassId =
        student.passId;


    showStudent(student);


    showMessage(
        "Student found successfully."
    );

}


// ==========================================
// MARK PAYMENT PAID
// ==========================================

async function markStudentPaid() {

    if (!selectedPassId) {

        showMessage(
            "Please search a student first.",
            "error"
        );

        return;

    }


    const confirmPayment =
        confirm(
            "Confirm payment received?"
        );


    if (!confirmPayment) {

        return;

    }


    const success =
        await updatePaymentStatus(
            selectedPassId,
            "PAID"
        );


    if (!success) {

        showMessage(
            "Unable to update payment.",
            "error"
        );

        return;

    }


    updatePaymentDisplay("PAID");


    showMessage(
        "Payment successfully marked as PAID."
    );

}


// ==========================================
// BUTTONS
// ==========================================

document
.getElementById("searchButton")
.addEventListener(
    "click",
    searchPass
);


document
.getElementById("paidButton")
.addEventListener(
    "click",
    markStudentPaid
);


// ==========================================
// ENTER KEY
// ==========================================

document
.getElementById("searchPassId")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchPass();

        }

    }
);

</script>

</body>

</html>
