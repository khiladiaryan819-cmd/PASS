<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusPass - Volunteer Payment</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<script>
(function () {

    const VOLUNTEER_PIN = "135790";

const enteredPin = prompt("Enter Volunteer PIN:");

if (enteredPin !== VOLUNTEER_PIN) {
    alert("Access Denied");
    window.location.href = "index.html";
} else {

    const volunteerId =
        prompt("Enter your Volunteer ID / Name:");

    if (!volunteerId || !volunteerId.trim()) {
        alert("Volunteer ID / Name is required.");
        window.location.href = "index.html";
    } else {

        sessionStorage.setItem(
            "JEMS_VOLUNTEER_ID",
            volunteerId.trim()
        );
    }
}
})();
</script>


<div class="container">

    <div class="header">

        <h1>CampusPass</h1>

        <p>Volunteer Payment Verification</p>

    </div>


    <div class="card">

        <h2>💰 Payment Verification</h2>


        <!-- SEARCH -->

        <div class="input-group">

            <label for="studentSearch">
                Search Student
            </label>

            <input
                type="text"
                id="studentSearch"
                placeholder="Pass ID / Name / Roll No / Mobile"
                autocomplete="off">

        </div>


        <button
            type="button"
            class="register-btn"
            id="searchButton">

            🔍 Search Student

        </button>


        <button
            type="button"
            class="register-btn"
            id="clearButton"
            style="margin-top:10px;">

            🔄 Clear / New Search

        </button>


        <!-- MESSAGE -->

        <div
            id="volunteerMessage"
            style="
                margin-top:15px;
                text-align:center;
                font-weight:600;
            ">
        </div>


        <!-- RESULT -->

        <div
            id="studentResult"
            style="
                display:none;
                margin-top:20px;
            ">


            <div class="student-info">

                <div class="info-row">
                    <span>Student Name</span>
                    <strong id="resultName">-</strong>
                </div>


                <div class="info-row">
                    <span>Roll Number</span>
                    <strong id="resultRoll">-</strong>
                </div>


                <div class="info-row">
                    <span>Branch</span>
                    <strong id="resultBranch">-</strong>
                </div>


                <div class="info-row">
                    <span>Year</span>
                    <strong id="resultYear">-</strong>
                </div>


                <div class="info-row">
                    <span>Mobile</span>
                    <strong id="resultMobile">-</strong>
                </div>


                <div class="info-row">
                    <span>Pass ID</span>
                    <strong id="resultPassId">-</strong>
                </div>

            </div>


            <!-- PAYMENT STATUS -->

            <div
                id="resultPaymentStatus"
                class="status pending"
                style="margin-top:18px;">

                PAYMENT PENDING

            </div>


            <!-- PAID BUTTON -->

            <button
                id="paidButton"
                type="button"
                class="register-btn"
                style="margin-top:15px;">

                ✓ Mark Payment as PAID

            </button>


        </div>


        <!-- BACK -->

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='index.html'"
            style="margin-top:12px;">

            ← Back

        </button>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- JEMS APP -->

<script src="app.js"></script>


<script>

// ==========================================
// SELECTED STUDENT
// ==========================================

let selectedPassId = null;


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(message, type = "success") {

    const box =
        document.getElementById(
            "volunteerMessage"
        );


    box.textContent =
        message;


    box.style.color =
        type === "error"
            ? "red"
            : "green";

}


// ==========================================
// PAYMENT DISPLAY
// ==========================================

function updatePaymentDisplay(status) {

    const box =
        document.getElementById(
            "resultPaymentStatus"
        );


    const button =
        document.getElementById(
            "paidButton"
        );


    if (
        String(status).toUpperCase() ===
        "PAID"
    ) {

        box.textContent =
            "✓ PAYMENT PAID";


        box.className =
            "status paid";


        button.textContent =
            "✓ Payment Already PAID";


        button.disabled =
            true;


        button.style.opacity =
            "0.6";

    }

    else {

        box.textContent =
            "⚠ PAYMENT PENDING";


        box.className =
            "status pending";


        button.textContent =
            "✓ Mark Payment as PAID";


        button.disabled =
            false;


        button.style.opacity =
            "1";

    }

}


// ==========================================
// SHOW STUDENT
// ==========================================

function showStudent(student) {

    document.getElementById(
        "resultName"
    ).textContent =
        student.name || "-";


    document.getElementById(
        "resultRoll"
    ).textContent =
        student.rollNo || "-";


    document.getElementById(
        "resultBranch"
    ).textContent =
        student.branch || "-";


    document.getElementById(
        "resultYear"
    ).textContent =
        student.year || "-";


    document.getElementById(
        "resultMobile"
    ).textContent =
        student.mobile || "-";


    document.getElementById(
        "resultPassId"
    ).textContent =
        student.passId || "-";


    updatePaymentDisplay(
        student.paymentStatus
    );


    document.getElementById(
        "studentResult"
    ).style.display =
        "block";

}


// ==========================================
// SEARCH STUDENT
// ==========================================

async function searchStudent() {

    const input =
        document.getElementById(
            "studentSearch"
        );


    const searchText =
        input.value
            .trim();


    if (!searchText) {

        showMessage(
            "Please enter Pass ID, Name, Roll No or Mobile.",
            "error"
        );

        return;

    }


    // --------------------------------------
    // First try Pass ID
    // --------------------------------------

    let student =
        await findStudentByPassId(
            searchText
        );


    // --------------------------------------
    // If Pass ID not found, search other data
    // --------------------------------------

    if (!student) {

        const {
            data,
            error
        } = await db
            .from("students")
            .select("*")
            .or(
                "name.ilike.%" +
                searchText +
                "%," +
                "roll_no.ilike.%" +
                searchText +
                "%," +
                "mobile.ilike.%" +
                searchText +
                "%"
            )
            .limit(10);


        if (
            !error &&
            data &&
            data.length > 0
        ) {

            if (data.length === 1) {

                const found =
                    data[0];


                student = {

                    name:
                        found.name,

                    rollNo:
                        found.roll_no,

                    branch:
                        found.branch,

                    year:
                        found.year,

                    mobile:
                        found.mobile,

                    passId:
                        found.pass_id,

                    paymentStatus:
                        found.payment_status

                };

            }

            else {

                showMessage(
                    "Multiple students found. Please search using Pass ID.",
                    "error"
                );

                document.getElementById(
                    "studentResult"
                ).style.display =
                    "none";

                return;

            }

        }

    }


    // --------------------------------------
    // Student not found
    // --------------------------------------

    if (!student) {

        selectedPassId =
            null;


        document.getElementById(
            "studentResult"
        ).style.display =
            "none";


        showMessage(
            "❌ Student not found.",
            "error"
        );

        return;

    }


    selectedPassId =
        student.passId;


    showStudent(
        student
    );


    showMessage(
        "✅ Student found successfully."
    );

}


// ==========================================
// MARK PAYMENT PAID
// ==========================================

async function markStudentPaid() {

    if (!selectedPassId) {

        showMessage(
            "Please search a student first.",
            "error"
        );

        return;

    }


    const confirmPayment =
        confirm(
            "Confirm payment received?"
        );


    if (!confirmPayment) {

        return;

    }


    const success =
        await updatePaymentStatus(
            selectedPassId,
            "PAID"
        );


    if (!success) {

        showMessage(
            "❌ Unable to update payment.",
            "error"
        );

        return;

    }


    updatePaymentDisplay(
        "PAID"
    );


    showMessage(
        "✅ Payment successfully marked as PAID."
    );

}


// ==========================================
// CLEAR / NEW SEARCH
// ==========================================

function clearSearch() {

    selectedPassId =
        null;


    document.getElementById(
        "studentSearch"
    ).value =
        "";


    document.getElementById(
        "studentResult"
    ).style.display =
        "none";


    document.getElementById(
        "volunteerMessage"
    ).textContent =
        "";


    document.getElementById(
        "studentSearch"
    ).focus();

}


// ==========================================
// SEARCH BUTTON
// ==========================================

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchStudent
    );


// ==========================================
// PAID BUTTON
// ==========================================

document
    .getElementById(
        "paidButton"
    )
    .addEventListener(
        "click",
        markStudentPaid
    );


// ==========================================
// CLEAR BUTTON
// ==========================================

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        clearSearch
    );


// ==========================================
// ENTER KEY
// ==========================================

document
    .getElementById(
        "studentSearch"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                searchStudent();

            }

        }
    );

</script>

</body>

</html>
