<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universal Event Pass</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fa;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.header{
    background:linear-gradient(135deg,#1565c0,#1e88e5);
    color:white;
    padding:22px;
    border-radius:16px;
    margin-bottom:18px;
}

.header h1{
    margin:0 0 6px;
    font-size:25px;
}

.header p{
    margin:0;
    font-size:14px;
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:18px;
    box-shadow:0 2px 10px #dce1e6;
}

.card h2{
    margin-top:0;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:10px 0 5px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccd2d8;
    border-radius:9px;
    font-size:14px;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.button{
    width:100%;
    border:0;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.create{
    background:#1e88e5;
    color:white;
}

.refresh{
    background:#eef3f8;
}

.open{
    background:#1e88e5;
    color:white;
}

.complete{
    background:#777;
    color:white;
}

.event-card{
    border:1px solid #e0e5ea;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.event-name{
    font-size:18px;
    font-weight:bold;
    margin:0 0 8px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.active{
    background:#e8f5e9;
    color:#188038;
}

.completed{
    background:#eee;
    color:#666;
}

.info{
    font-size:13px;
    line-height:1.7;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
    font-size:13px;
}

.error{
    background:#ffebee;
    color:#c62828;
}

.success{
    background:#e8f5e9;
    color:#2e7d32;
}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎟️ Universal Event Pass</h1>

        <p>
            Create and manage all your events.
        </p>

    </div>


    <div id="message" class="message"></div>


    <!-- CREATE EVENT -->

    <div class="card">

        <h2>➕ Create New Event</h2>

        <label>Event Name *</label>

        <input
            id="eventName"
            type="text"
            placeholder="Example: Ganesh Utsav 2026"
        >


        <div class="grid">

            <div>

                <label>Event Date</label>

                <input
                    id="eventDate"
                    type="date"
                >

            </div>

            <div>

                <label>Venue</label>

                <input
                    id="venue"
                    type="text"
                    placeholder="College / Hall / Home"
                >

            </div>

        </div>


        <div class="grid">

            <div>

                <label>Start Time</label>

                <input
                    id="startTime"
                    type="time"
                >

            </div>

            <div>

                <label>End Time</label>

                <input
                    id="endTime"
                    type="time"
                >

            </div>

        </div>


        <label>Description</label>

        <textarea
            id="description"
            placeholder="Event description"
        ></textarea>


        <div class="grid">

            <div>

                <label>Payment Amount (₹)</label>

                <input
                    id="paymentAmount"
                    type="number"
                    min="0"
                    placeholder="0"
                >

            </div>

            <div>

                <label>Registration Limit</label>

                <input
                    id="registrationLimit"
                    type="number"
                    min="1"
                    placeholder="No limit"
                >

            </div>

        </div>


        <label>Primary Color</label>

        <input
            id="primaryColor"
            type="color"
            value="#1e88e5"
        >


        <label>Secondary Color</label>

        <input
            id="secondaryColor"
            type="color"
            value="#ffffff"
        >


        <label>Logo URL (Optional)</label>

        <input
            id="logoUrl"
            type="url"
            placeholder="https://..."
        >


        <label>Banner URL (Optional)</label>

        <input
            id="bannerUrl"
            type="url"
            placeholder="https://..."
        >


        <label style="display:flex;align-items:center;gap:8px;">

            <input
                id="registrationOpen"
                type="checkbox"
                checked
                style="width:auto;"
            >

            Registration Open

        </label>


        <button
            id="createButton"
            class="button create"
            type="button"
        >
            ➕ Create Event
        </button>

    </div>


    <!-- EVENTS -->

    <div class="card">

        <h2>📋 My Events</h2>

        <input
            id="eventSearch"
            type="text"
            placeholder="🔍 Search event..."
        >


        <button
            id="refreshButton"
            class="button refresh"
            type="button"
        >
            🔄 Refresh Events
        </button>


        <div id="eventList">
            Loading events...
        </div>

    </div>

</div>


<script>

/* ==========================================
   EVENT SYSTEM
========================================== */

let allEvents = [];


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display = "block";

}


/* ==========================================
   GET DATABASE
========================================== */

function getDatabase(){

    if(
        !window.db ||
        typeof window.db.from !== "function"
    ){

        showMessage(
            "Supabase is not loaded. Please refresh the page.",
            "error"
        );

        return null;
    }

    return window.db;

}


/* ==========================================
   LOAD EVENTS
========================================== */

async function loadEvents(){

    const db = getDatabase();

    if(!db) return;


    const list =
        document.getElementById("eventList");

    list.innerHTML =
        "⏳ Loading events...";


    const result =
        await db
        .from("events")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(
            "Load events error:",
            result.error
        );

        list.innerHTML =
            "❌ Unable to load events.";

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    allEvents =
        result.data || [];


    displayEvents(allEvents);

}


/* ==========================================
   DISPLAY
========================================== */

function displayEvents(events){

    const list =
        document.getElementById("eventList");


    if(!events.length){

        list.innerHTML =
            `
            <div style="
                text-align:center;
                padding:25px;
                color:#777;
            ">
                No events found.
            </div>
            `;

        return;
    }


    let html = "";


    events.forEach(event => {

        const status =
            String(
                event.status || "ACTIVE"
            ).toUpperCase();


        const statusClass =
            status === "ACTIVE"
            ? "active"
            : "completed";


        html += `

        <div class="event-card">

            <p class="event-name">
                🎉 ${escapeHTML(event.name)}
            </p>

            <span class="status ${statusClass}">
                ${escapeHTML(status)}
            </span>


            <div class="info">

                <br>

                📅 <b>Date:</b>
                ${escapeHTML(
                    event.event_date || "Not set"
                )}

                <br>

                ⏰ <b>Time:</b>
                ${escapeHTML(
                    event.start_time || "--"
                )}
                -
                ${escapeHTML(
                    event.end_time || "--"
                )}

                <br>

                📍 <b>Venue:</b>
                ${escapeHTML(
                    event.venue || "Not set"
                )}

                <br>

                💰 <b>Amount:</b>
                ₹${Number(
                    event.payment_amount || 0
                )}

                <br>

                📝 <b>Registration:</b>
                ${
                    event.registration_open
                    ? "OPEN"
                    : "CLOSED"
                }

            </div>


            <div class="actions">

                <button
                    class="button open"
                    type="button"
                    onclick="openEvent('${event.id}')"
                >
                    ▶️ Open Event
                </button>


                ${
                    status === "ACTIVE"
                    ?
                    `
                    <button
                        class="button complete"
                        type="button"
                        onclick="completeEvent('${event.id}')"
                    >
                        ⏹️ Complete
                    </button>
                    `
                    :
                    `
                    <button
                        class="button refresh"
                        type="button"
                        disabled
                    >
                        ✓ Completed
                    </button>
                    `
                }

            </div>

        </div>

        `;

    });


    list.innerHTML = html;

}


/* ==========================================
   CREATE EVENT
========================================== */

async function createEvent(){

    const db = getDatabase();

    if(!db) return;


    const name =
        document
        .getElementById("eventName")
        .value
        .trim();


    if(!name){

        showMessage(
            "Please enter Event Name.",
            "error"
        );

        return;
    }


    const amount =
        Number(
            document
            .getElementById("paymentAmount")
            .value || 0
        );


    const limitText =
        document
        .getElementById("registrationLimit")
        .value
        .trim();


    const limit =
        limitText
        ? Number(limitText)
        : null;


    const button =
        document.getElementById(
            "createButton"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Creating Event...";


    const eventData = {

        name:name,

        event_date:
            document
            .getElementById("eventDate")
            .value || null,

        start_time:
            document
            .getElementById("startTime")
            .value || null,

        end_time:
            document
            .getElementById("endTime")
            .value || null,

        venue:
            document
            .getElementById("venue")
            .value
            .trim() || null,

        description:
            document
            .getElementById("description")
            .value
            .trim() || null,

        payment_required:
            amount > 0,

        payment_amount:
            amount,

        registration_limit:
            limit,

        registration_open:
            document
            .getElementById("registrationOpen")
            .checked,

        primary_color:
            document
            .getElementById("primaryColor")
            .value,

        secondary_color:
            document
            .getElementById("secondaryColor")
            .value,

        logo_url:
            document
            .getElementById("logoUrl")
            .value
            .trim() || null,

        banner_url:
            document
            .getElementById("bannerUrl")
            .value
            .trim() || null,

        status:"ACTIVE"

    };


    console.log(
        "Creating event:",
        eventData
    );


    const result =
        await db
        .from("events")
        .insert(eventData)
        .select()
        .single();


    button.disabled = false;

    button.textContent =
        "➕ Create Event";


    if(result.error){

        console.error(
            "Create event error:",
            result.error
        );

        showMessage(
            "❌ " + result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "✅ Event created successfully!",
        "success"
    );


    clearForm();

    loadEvents();

}


/* ==========================================
   CLEAR FORM
========================================== */

function clearForm(){

    document.getElementById(
        "eventName"
    ).value = "";

    document.getElementById(
        "eventDate"
    ).value = "";

    document.getElementById(
        "startTime"
    ).value = "";

    document.getElementById(
        "endTime"
    ).value = "";

    document.getElementById(
        "venue"
    ).value = "";

    document.getElementById(
        "description"
    ).value = "";

    document.getElementById(
        "paymentAmount"
    ).value = "";

    document.getElementById(
        "registrationLimit"
    ).value = "";

    document.getElementById(
        "logoUrl"
    ).value = "";

    document.getElementById(
        "bannerUrl"
    ).value = "";

    document.getElementById(
        "registrationOpen"
    ).checked = true;

}


/* ==========================================
   OPEN EVENT
========================================== */

function openEvent(id){

    localStorage.setItem(
        "JEMS_CURRENT_EVENT",
        id
    );


    window.location.href =
        "organizer.html";

}


/* ==========================================
   COMPLETE EVENT
========================================== */

async function completeEvent(id){

    if(
        !confirm(
            "Complete this event?"
        )
    ){

        return;
    }


    const db = getDatabase();

    if(!db) return;


    const result =
        await db
        .from("events")
        .update({

            status:"COMPLETED",

            registration_open:false

        })
        .eq("id",id);


    if(result.error){

        showMessage(
            "❌ " +
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "✅ Event completed.",
        "success"
    );


    loadEvents();

}


/* ==========================================
   SEARCH
========================================== */

function searchEvents(){

    const value =
        document
        .getElementById("eventSearch")
        .value
        .trim()
        .toLowerCase();


    if(!value){

        displayEvents(allEvents);

        return;
    }


    const filtered =
        allEvents.filter(event => {

            const text =
                (
                    event.name || ""
                ) +
                " " +
                (
                    event.venue || ""
                ) +
                " " +
                (
                    event.description || ""
                ) +
                " " +
                (
                    event.status || ""
                );


            return text
                .toLowerCase()
                .includes(value);

        });


    displayEvents(filtered);

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   BUTTON EVENTS
========================================== */

document
.getElementById("createButton")
.addEventListener(
    "click",
    createEvent
);


document
.getElementById("refreshButton")
.addEventListener(
    "click",
    loadEvents
);


document
.getElementById("eventSearch")
.addEventListener(
    "input",
    searchEvents
);


/* ==========================================
   START
========================================== */

loadEvents();

</script>

</body>
</html>
